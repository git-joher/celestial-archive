<body>

<!-- Canvas -->
<div id="game-wrapper">
  <canvas id="game-canvas"></canvas>
</div>

<!-- HUD -->
<div id="game-hud">
  <div class="hud-top">
    <div class="hud-left">
      <div class="hp-bar-wrap">
        <span class="hp-label-text">Wukong</span>
        <div class="hp-outer"><div class="hp-inner" id="hp-inner" style="width:100%;"></div></div>
        <span class="hp-num" id="hp-num">100/100</span>
      </div>
      <div class="xp-outer"><div class="xp-inner" id="xp-inner" style="width:0%;"></div></div>
      <div class="hud-stat">LV <span id="hud-lv">1</span></div>
    </div>
    <div class="hud-right">
      <div class="hud-stat">波 <span id="hud-wave">1</span> · <span id="hud-time">0:00</span></div>
      <div class="hud-stat">击杀 <span id="hud-kills">0</span></div>
      <div class="upgrade-icons" id="upgrade-icons"></div>
    </div>
  </div>
</div>

<!-- Upgrade Selection -->
<div id="upgrade-overlay">
  <div class="upgrade-title">选择升级</div>
  <div class="upgrade-sub">Choose Your Power</div>
  <div class="upgrade-cards" id="upgrade-cards"></div>
</div>

<!-- Death Screen -->
<div id="death-overlay">
  <div class="death-title">大闹天宫</div>
  <div class="death-stats">
    <div class="death-stat"><div class="death-stat-val" id="death-time">0:00</div><div class="death-stat-label">Survival Time</div></div>
    <div class="death-stat"><div class="death-stat-val" id="death-wave">1</div><div class="death-stat-label">Highest Wave</div></div>
    <div class="death-stat"><div class="death-stat-val" id="death-kills">0</div><div class="death-stat-label">Kills</div></div>
    <div class="death-stat"><div class="death-stat-val" id="death-score">0</div><div class="death-stat-label">Score</div></div>
  </div>
  <button class="btn-start" id="btn-restart" style="font-size:1rem;padding:14px 40px;">Play Again</button>
</div>

<!-- Mobile Controls -->
<div id="mobile-controls">
  <div class="mobile-joystick" id="mobile-joystick">
    <div class="mobile-joystick-knob" id="mobile-joystick-knob"></div>
  </div>
  <div class="mobile-skill-btn" id="mobile-skill-btn">爆发</div>
</div>
