<body>

  <div id="bestiary-overlay" class="bestiary-overlay"></div>

  <main class="bestiary-stage" aria-label="Mythical Beast Collection">

    <section id="phase-map" class="bestiary-phase active">
      <div class="map-container" id="map-container">
        <div class="map-bg-layer map-bg-deep"></div>
        <div class="map-bg-layer map-bg-mid"></div>
        <div class="map-bg-layer map-bg-fore"></div>
        <div class="map-regions" id="map-regions"></div>
        <div class="map-mist map-mist-1"></div>
        <div class="map-mist map-mist-2"></div>
      </div>
      <div class="map-header">
        <h1 class="map-title">神兽收集</h1>
        <p class="map-subtitle">Mythical Beast Collection</p>
        <div class="map-counter" id="collection-counter">0 / 20</div>
      </div>
      <div class="map-actions">
        <button id="btn-gallery" class="btn-gallery">View Bestiary</button>
      </div>
    </section>

    <section id="phase-explore" class="bestiary-phase">
      <div class="explore-overlay" id="explore-overlay">
        <div class="explore-text" id="explore-text"></div>
        <div class="explore-particles" id="explore-particles"></div>
      </div>
    </section>

    <section id="phase-riddle" class="bestiary-phase">
      <div class="riddle-parchment" id="riddle-parchment">
        <div class="riddle-text-zh" id="riddle-zh"></div>
        <div class="riddle-text-en" id="riddle-en"></div>
      </div>
      <div class="silhouette-row" id="silhouette-row"></div>
    </section>

    <section id="phase-reveal" class="bestiary-phase">
      <div class="reveal-container" id="reveal-container">
        <div class="reveal-shockwave" id="reveal-shockwave"></div>
        <div class="reveal-beast" id="reveal-beast"></div>
        <div class="reveal-result" id="reveal-result"></div>
      </div>
    </section>

    <section id="phase-card" class="bestiary-phase">
      <div class="beast-card-container" id="beast-card-container"></div>
      <div class="beast-card-actions">
        <button id="btn-share" class="btn-share">Download Share Card</button>
        <button id="btn-continue" class="btn-continue">Return to Map</button>
      </div>
    </section>

    <section id="phase-locked" class="bestiary-phase phase-locked">
      <div class="phase-locked-icon">🏔️</div>
      <h2 class="phase-locked-title">今日探索已毕</h2>
      <p class="phase-locked-sub">The mythical realms rest today. Return at dawn for a new encounter.<br>神兽亦需安歇，明日再续仙缘。</p>
      <div id="countdown-timer" class="countdown-timer">--:--:--</div>
      <button id="btn-view-collection-locked" class="btn-gallery">View Bestiary</button>
    </section>

  </main>

  <aside id="gallery-drawer" class="gallery-drawer" aria-label="Beast collection gallery">
    <div class="gallery-header">
      <span class="gallery-title">万兽图谱 · Bestiary</span>
      <button id="btn-gallery-close" class="gallery-close">&times;</button>
    </div>
    <div class="gallery-filters">
      <button class="gallery-filter active" data-filter="all">All</button>
      <button class="gallery-filter" data-filter="kunlun">昆仑</button>
      <button class="gallery-filter" data-filter="south">南山</button>
      <button class="gallery-filter" data-filter="west">西荒</button>
      <button class="gallery-filter" data-filter="north">北冥</button>
      <button class="gallery-filter" data-filter="heaven">天庭</button>
      <button class="gallery-filter" data-filter="underworld">幽冥</button>
    </div>
    <div class="gallery-grid" id="gallery-grid"></div>
  </aside>
